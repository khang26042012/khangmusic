# Tự động phát nhạc khi máy chủ khởi động
auto-start: true

# Tiền tố hiển thị trong khung chat
prefix: "&d[&e♫ KhangMusic&d] &7"

# Kiểu thông báo khi bài hát mới bắt đầu phát (CHAT, ACTIONBAR, hoặc BOTH)
